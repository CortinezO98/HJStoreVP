services:
  db:
    image: mariadb:10.11
    container_name: hjstorevp_db
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: ${DB_NAME:-hjstorevp}
      MYSQL_USER: ${DB_USER:-hjstore}
      MYSQL_PASSWORD: ${DB_PASSWORD:-hjstore123}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory-policy", "noeviction"]
    container_name: hjstorevp_redis
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hjstorevp_backend
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - DATABASE_URL=mysql+pymysql://${DB_USER:-hjstore}:${DB_PASSWORD:-hjstore123}@db:3306/${DB_NAME:-hjstorevp}
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-changeme_in_production_use_long_random_string}
      - MFA_ENCRYPTION_KEYS=${MFA_ENCRYPTION_KEYS:-}
      - MFA_RECOVERY_PEPPER=${MFA_RECOVERY_PEPPER:-}
      - ENVIRONMENT=development
      - ALLOW_DEMO_PAYMENTS=true
    volumes:
      - ./backend:/app
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).close()"]
      interval: 30s
      timeout: 5s
      start_period: 35s
      retries: 3
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  reservation-worker:
    profiles: ["reservations"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: on-failure
    environment:
      - DATABASE_URL=mysql+pymysql://${DB_USER:-hjstore}:${DB_PASSWORD:-hjstore123}@db:3306/${DB_NAME:-hjstorevp}
      - ENVIRONMENT=development
      - ORDER_EXPIRATION_WORKER_ENABLED=${ORDER_EXPIRATION_WORKER_ENABLED:-false}
    volumes:
      - ./backend:/app
    depends_on:
      backend:
        condition: service_healthy
    command: python -m app.services.reservation_worker --loop

  notification-worker:
    profiles: ["notifications"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hjstorevp_notification_worker
    restart: on-failure
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      - DATABASE_URL=mysql+pymysql://${DB_USER:-hjstore}:${DB_PASSWORD:-hjstore123}@db:3306/${DB_NAME:-hjstorevp}
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=development
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
    command: python -m app.services.notification_worker --loop

  cart-recovery-worker:
    profiles: ["cart-recovery"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hjstorevp_cart_recovery
    restart: on-failure
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      - DATABASE_URL=mysql+pymysql://${DB_USER:-hjstore}:${DB_PASSWORD:-hjstore123}@db:3306/${DB_NAME:-hjstorevp}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - EMAIL_NOTIFICATIONS_ENABLED=${EMAIL_NOTIFICATIONS_ENABLED:-false}
      - EMAIL_LIVE_DELIVERY_ALLOWED=${EMAIL_LIVE_DELIVERY_ALLOWED:-false}
      - CART_RECOVERY_DELIVERY_ENABLED=${CART_RECOVERY_DELIVERY_ENABLED:-false}
      - CART_RECOVERY_LIVE_ALLOWED=${CART_RECOVERY_LIVE_ALLOWED:-false}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - EMAILS_FROM=${EMAILS_FROM:-}
      - STORE_PUBLIC_URL=${STORE_PUBLIC_URL:-http://localhost:5173}
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
    command: python -m app.services.cart_recovery_worker --loop

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hjstorevp_frontend
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend

  frontend-admin:
    build:
      context: ./frontend-admin
      dockerfile: Dockerfile
    container_name: hjstorevp_admin
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "127.0.0.1:5174:5174"
    volumes:
      - ./frontend-admin:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend

volumes:
  db_data:
  redis_data:
  uploads_data:
