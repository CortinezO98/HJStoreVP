name: Fase D - estabilidad y rendimiento

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e-isolation-contract:
    name: E2.2 - revisar sintaxis y aislamiento Docker E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Comprobar sintaxis de verificadores E2E
        run: python -m py_compile backend/e2e_seed.py tests/e2e/test_store_browser.py tests/e2e/test_mariadb_concurrency.py
      - name: Validar configuracion separada de Compose
        run: docker compose -f docker-compose.e2e.yml config --quiet

  phase-e-smoke-contract:
    name: Fase E - controles pasivos locales (unitarios)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validar limites de seguridad del smoke checker
        run: python -m unittest discover -s scripts -p 'test_phase_e_smoke.py' -v

  backend-regression:
    name: Backend - regresion completa
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - name: Ejecutar pruebas funcionales y de seguridad
        run: python -m pytest tests/ -q

  admin-regression:
    name: Admin - contrato y modulos lazy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-admin
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Instalar dependencias bloqueadas
        run: npm ci --no-audit --no-fund
      - name: Bloquear avisos altos o criticos npm
        run: npm audit --audit-level=high
      - name: Verificar contratos administrativos
        run: node scripts/verify-admin-modules.mjs
      - name: Compilar panel
        run: npm run build
      - name: Verificar separacion real de JavaScript
        run: |
          count=$(find dist/assets -maxdepth 1 -type f -name '*.js' | wc -l)
          echo "Bundles JavaScript: $count"
          test "$count" -gt 1

  public-store-regression:
    name: Tienda publica - compilacion
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Instalar dependencias bloqueadas
        run: npm ci --no-audit --no-fund
      - name: Bloquear avisos altos o criticos npm
        run: npm audit --audit-level=high
      - name: Verificar rutas y checkout de tienda
        run: npm run verify:routes
      - name: Verificar contrato del carrito y checkout (Fase E.2)
        run: node scripts/verify-cart-checkout.mjs
      - name: Compilar tienda publica
        run: npm run build

  dependency-inventory:
    name: Dependencias - informe sin actualizacion automatica
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validar analizador de reportes
        run: python -m unittest discover -s scripts/ci -p 'test_*.py'
      - name: Preparar inventario npm reproducible
        working-directory: frontend-admin
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Auditoria npm (fallos de herramienta bloquean, vulnerabilidades se reportan)
        working-directory: frontend-admin
        shell: bash
        run: |
          set +e
          npm audit --audit-level=high --json > ../admin-dependency-audit.json 2> ../npm-audit-errors.txt
          code=$?
          set -e
          echo "npm_audit_exit=$code" >> "$GITHUB_ENV"
          if [ "$code" -gt 1 ]; then
            echo "::error::npm audit no pudo completarse (codigo $code)."
            cat ../npm-audit-errors.txt
            exit "$code"
          fi
          python ../scripts/ci/summarize_dependency_audit.py npm ../admin-dependency-audit.json
          python ../scripts/ci/triage_dependency_audits.py npm ../admin-dependency-audit.json --project 'Panel administrativo' --output ../admin-audit-triage.md
          cat ../admin-audit-triage.md >> "$GITHUB_STEP_SUMMARY"
          if [ "$code" -eq 1 ]; then
            echo "::error::El panel contiene hallazgos npm altos o criticos."
            exit 1
          fi
      - name: Preparar inventario npm de tienda publica
        working-directory: frontend
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Auditoria npm de tienda publica
        working-directory: frontend
        shell: bash
        run: |
          set +e
          npm audit --audit-level=high --json > ../store-dependency-audit.json 2> ../store-npm-audit-errors.txt
          code=$?
          set -e
          if [ "$code" -gt 1 ]; then
            echo "::error::npm audit de tienda falló (codigo $code)"
            cat ../store-npm-audit-errors.txt
            exit "$code"
          fi
          python ../scripts/ci/summarize_dependency_audit.py npm ../store-dependency-audit.json
          python ../scripts/ci/triage_dependency_audits.py npm ../store-dependency-audit.json --project 'Tienda publica' --output ../store-audit-triage.md
          cat ../store-audit-triage.md >> "$GITHUB_STEP_SUMMARY"
          if [ "$code" -eq 1 ]; then
            echo "::error::La tienda contiene hallazgos npm altos o criticos."
            exit 1
          fi
      - name: Preparar auditoria Python
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check pip-audit
      - name: Auditoria Python (fallos de herramienta bloquean, vulnerabilidades se reportan)
        working-directory: backend
        shell: bash
        run: |
          set +e
          python -m pip_audit --requirement requirements.txt --format json > ../backend-dependency-audit.json 2> ../pip-audit-errors.txt
          code=$?
          set -e
          echo "pip_audit_exit=$code" >> "$GITHUB_ENV"
          if [ "$code" -gt 1 ]; then
            echo "::error::pip-audit no pudo completarse (codigo $code)."
            cat ../pip-audit-errors.txt
            exit "$code"
          fi
          python ../scripts/ci/summarize_dependency_audit.py python ../backend-dependency-audit.json
          python ../scripts/ci/triage_dependency_audits.py python ../backend-dependency-audit.json --project 'Backend Python' --output ../backend-audit-triage.md
          cat ../backend-audit-triage.md >> "$GITHUB_STEP_SUMMARY"
      - name: Publicar informes para revision
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: fase-d-dependency-audits
          path: |
            admin-dependency-audit.json
            store-dependency-audit.json
            backend-dependency-audit.json
            admin-audit-triage.md
            store-audit-triage.md
            backend-audit-triage.md
            npm-audit-errors.txt
            store-npm-audit-errors.txt
            pip-audit-errors.txt
          if-no-files-found: warn
          retention-days: 14
