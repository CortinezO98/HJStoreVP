name: Fase D - estabilidad y rendimiento

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-regression:
    name: Backend - regresion completa
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Ejecutar pruebas funcionales y de seguridad
        run: python -m pytest tests/ -q

  admin-regression:
    name: Admin - contrato y modulos lazy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - name: Verificar contratos administrativos
        run: node scripts/verify-admin-modules.mjs
      - name: Compilar panel
        run: npm run build
      - name: Verificar separacion real de JavaScript
        run: |
          count=$(find dist/assets -maxdepth 1 -type f -name '*.js' | wc -l)
          echo "Bundles JavaScript: $count"
          test "$count" -gt 1

  dependency-inventory:
    name: Dependencias - informe sin actualizacion automatica
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preparar inventario npm reproducible
        working-directory: frontend-admin
        shell: bash
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then
            echo "lockfile_present=true" >> "$GITHUB_ENV"
            npm ci --ignore-scripts --no-audit --no-fund
          else
            echo "::warning::No hay package-lock.json versionado. Inventario npm no reproducible; pendiente incorporar lockfile revisado."
            echo "lockfile_present=false" >> "$GITHUB_ENV"
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          fi
      - name: Auditoria npm (fallos de herramienta bloquean, vulnerabilidades se reportan)
        working-directory: frontend-admin
        shell: bash
        run: |
          set +e
          npm audit --json > ../admin-dependency-audit.json 2> ../npm-audit-errors.txt
          code=$?
          set -e
          echo "npm_audit_exit=$code" >> "$GITHUB_ENV"
          if [ "$code" -gt 1 ]; then
            echo "::error::npm audit no pudo completarse (codigo $code)."
            cat ../npm-audit-errors.txt
            exit "$code"
          fi
          python ../scripts/ci/summarize_dependency_audit.py npm ../admin-dependency-audit.json
      - name: Preparar auditoria Python
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check pip-audit
      - name: Auditoria Python (fallos de herramienta bloquean, vulnerabilidades se reportan)
        working-directory: backend
        shell: bash
        run: |
          set +e
          python -m pip_audit --requirement requirements.txt --format json > ../backend-dependency-audit.json 2> ../pip-audit-errors.txt
          code=$?
          set -e
          echo "pip_audit_exit=$code" >> "$GITHUB_ENV"
          if [ "$code" -gt 1 ]; then
            echo "::error::pip-audit no pudo completarse (codigo $code)."
            cat ../pip-audit-errors.txt
            exit "$code"
          fi
          python ../scripts/ci/summarize_dependency_audit.py python ../backend-dependency-audit.json
      - name: Publicar informes para revision
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fase-d-dependency-audits
          path: |
            admin-dependency-audit.json
            backend-dependency-audit.json
            npm-audit-errors.txt
            pip-audit-errors.txt
          if-no-files-found: warn
          retention-days: 14
