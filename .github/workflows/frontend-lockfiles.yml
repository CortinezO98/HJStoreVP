name: Frontends - generar lockfiles revisables

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    name: Validar lockfiles npm publicados
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Validar lockfile versionado del panel administrativo
        working-directory: frontend-admin
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          node scripts/verify-admin-modules.mjs
          npm run build
      - name: Validar lockfile versionado de tienda pública
        working-directory: frontend
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run verify:routes
          npm run build
      - name: Auditoría npm y clasificación del panel administrativo
        working-directory: frontend-admin
        shell: bash
        run: |
          set +e
          npm audit --audit-level=high --json > ../frontend-admin-audit.json 2> ../frontend-admin-audit-stderr.txt
          result=$?
          set -e
          if [ "$result" -gt 1 ]; then
            echo "::error::La herramienta npm audit del panel falló (código $result)"
            exit "$result"
          fi
          python ../scripts/ci/triage_dependency_audits.py npm ../frontend-admin-audit.json --project 'Panel administrativo' --output ../frontend-admin-audit-triage.md
          cat ../frontend-admin-audit-triage.md >> "$GITHUB_STEP_SUMMARY"
          if [ "$result" -eq 1 ]; then
            echo "::error::El panel tiene vulnerabilidades altas o criticas."
            exit 1
          fi
      - name: Auditoría npm y clasificación de tienda pública
        working-directory: frontend
        shell: bash
        run: |
          set +e
          npm audit --json > ../frontend-store-audit.json 2> ../frontend-store-audit-stderr.txt
          result=$?
          set -e
          if [ "$result" -gt 1 ]; then
            echo "::error::La herramienta npm audit de tienda falló (código $result)"
            exit "$result"
          fi
          python ../scripts/ci/triage_dependency_audits.py npm ../frontend-store-audit.json --project 'Tienda pública' --output ../frontend-store-audit-triage.md
          cat ../frontend-store-audit-triage.md >> "$GITHUB_STEP_SUMMARY"
          if [ "$result" -eq 1 ]; then
            echo "::error::La tienda tiene vulnerabilidades altas o criticas."
            exit 1
          fi
      - name: Publicar lockfiles y auditorías para revisión
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: hjstorevp-reviewed-npm-lockfiles
          path: |
            frontend-admin/package-lock.json
            frontend/package-lock.json
            frontend-admin-audit.json
            frontend-store-audit.json
            frontend-admin-audit-triage.md
            frontend-store-audit-triage.md
            frontend-admin-audit-stderr.txt
            frontend-store-audit-stderr.txt
          if-no-files-found: warn
          retention-days: 14
