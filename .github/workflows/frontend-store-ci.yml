name: Frontend Store CI

on:
  push:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-store-ci.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-store-ci.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install
      - name: Preserve admin and store navigation contract
        run: node scripts/check-functional-contract.mjs
      - name: Lint store
        run: npm run lint
      - name: Build store
        run: npm run build
