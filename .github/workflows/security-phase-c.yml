name: Fase C Audit CI

on:
  push:
    branches: [main]
    paths:
      - 'backend/app/api/v1/endpoints/security_audit.py'
      - 'backend/app/api/v1/endpoints/commercial_audit.py'
      - 'backend/app/services/commercial_change_audit.py'
      - 'backend/app/models/models.py'
      - 'backend/app/core/deps.py'
      - 'backend/tests/test_commercial_change_audit.py'
      - 'backend/app/api/v1/router.py'
      - 'backend/scripts/export_audit_snapshot.py'
      - 'backend/tests/test_commercial_audit.py'
      - 'frontend-admin/src/**'
      - 'backend/app/services/security_audit.py'
      - 'backend/tests/test_security_audit.py'
      - '.github/workflows/security-phase-c.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Security audit isolated tests
        run: python -m pytest tests/test_user_lifecycle.py tests/test_profile_mfa.py tests/test_security_audit.py tests/test_commercial_audit.py tests/test_commercial_change_audit.py -q
  admin-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npm run build
