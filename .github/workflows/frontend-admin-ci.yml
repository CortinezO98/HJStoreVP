name: Frontend Admin CI

on:
  push:
    paths:
      - 'frontend-admin/**'
      - '.github/workflows/frontend-admin-ci.yml'
  pull_request:
    paths:
      - 'frontend-admin/**'
      - '.github/workflows/frontend-admin-ci.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-admin
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit
          else
            echo "::warning::No hay lockfile versionado del panel; no se garantiza instalación reproducible."
            npm install --no-audit
          fi
      - name: Verify administrative functionality contract
        run: node scripts/verify-admin-modules.mjs
      - name: Build admin
        run: npm run build
