name: Frontend Admin CI

on:
  push:
    paths:
      - 'frontend-admin/**'
      - '.github/workflows/frontend-admin-ci.yml'
  pull_request:
    paths:
      - 'frontend-admin/**'
      - '.github/workflows/frontend-admin-ci.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install
      - name: Build admin
        run: npm run build
