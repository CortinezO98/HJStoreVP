name: Frontend Admin CI

on:
  push:
    paths:
      - 'frontend-admin/**'
      - '.github/workflows/frontend-admin-ci.yml'
  pull_request:
    paths:
      - 'frontend-admin/**'
      - '.github/workflows/frontend-admin-ci.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-admin
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Instalar exactamente las dependencias versionadas
        run: npm ci --no-audit --no-fund
      - name: Bloquear vulnerabilidades altas y criticas
        run: npm audit --audit-level=high
      - name: Verify administrative functionality contract
        run: node scripts/verify-admin-modules.mjs
      - name: Build admin
        run: npm run build
